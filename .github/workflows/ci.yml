# Runs every check (`npm run check`) on every push to any branch. It needs no secrets.
name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: 8.30.1
      LEFTHOOK: "0" # don't install the git hooks on the runner
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the whole history, for gitleaks

      # Secrets first, so a leaked secret fails the run straight away.
      - name: Install gitleaks
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum --check
          tar -xzf "$tarball" gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
      - name: Scan the repo and its history for secrets
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact --verbose

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install dependencies
        run: |
          npm ci
          uv sync --locked

      # The end-to-end tests use the Google Chrome already on the runner (channel: "chrome").
      - name: npm run check
        run: npm run check

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

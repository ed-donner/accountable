# Alembic settings. The database address comes from the app's settings
# (ACCOUNTABLE_DB_PATH), not from this file.

[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = .
path_separator = os

# Logging, used only when migrations run from the alembic command.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

# Alembic settings. The database URL comes from ACCOUNTABLE_DB (see backend/app/config.py),
# and the backend applies migrations itself each time it starts.
[alembic]
script_location = %(here)s/backend/migrations
prepend_sys_path = %(here)s/backend
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

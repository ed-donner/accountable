<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <script>
      // The saved theme's mode goes on before anything draws, so the other mode never
      // flashes first. It does what lib/theme.ts does, with the same key: System asks
      // the device, and anything else but dark, or storage that can't be read, is light.
      try {
        const theme = localStorage.getItem("accountable-mode");
        const dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.mode = dark ? "dark" : "light";
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {
        // Light mode, then.
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Accountable</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

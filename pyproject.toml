[project]
name = "accountable"
version = "0.1.0"
description = "A sales CRM that runs on your own computer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.2",
    "pyjwt[crypto]>=2.15.1",
    "reportlab>=5.1.0",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "backend"
module-name = "accountable"

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
# Starlette's test client now prefers httpx2. The plan's stack uses httpx, which still works.
filterwarnings = ["ignore:Using `httpx` with"]

[dependency-groups]
dev = [
    "pypdf>=6.21.4",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "ty>=0.0.95",
]

[tool.ruff]
line-length = 120
# Python in the docs and the course is there to be read, not run.
extend-exclude = ["*.md"]

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.coverage.run]
source = ["accountable"]

[tool.coverage.report]
fail_under = 80

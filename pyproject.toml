[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM (backend)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.163.0",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM that runs on your own computer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "faker>=40.54.0",
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q --cov=app --cov-report=term-missing:skip-covered --cov-fail-under=80"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "ty>=0.0.107",
]

[tool.ruff]
src = ["backend"]
line-length = 100

[tool.ruff.lint]
extend-select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ty.environment]
extra-paths = ["backend"]

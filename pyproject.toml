[project]
name = "accountable"
version = "0.1.0"
description = "Accountable: a sales CRM that runs on your own computer"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "faker>=40.54.0",
    "fastapi>=0.163.1",
    "pydantic>=2.14.3",
    "sqlalchemy>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
]
